<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0C2A33" />
<title>Withdraw from Bank - DeenWallet Transfer</title>
<link rel="icon" href="/assets/logo.png" />
<style>
:root{--ink:#0C2A33;--ink2:#46606A;--lagoon:#1C7A91;--tint:#E3F2F5;--mist:#F2F7F8;--line:#DAE7EB;--ok:#1E8449;--bad:#C0392B}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--mist);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center;box-shadow:0 14px 34px -18px rgba(12,42,51,.45)}
.card img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.badge{width:64px;height:64px;border-radius:50%;margin:14px auto 6px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800;color:#fff;background:var(--ok)}
.badge.cancel{background:var(--bad)}
h1{font-size:21px;margin:10px 0 6px}
p{margin:0 0 10px;color:var(--ink2);font-size:15px}
small{display:block;margin-top:14px;color:var(--ink2);font-size:13px}
</style>
</head>
<body>
<div class="card">
  <img src="/assets/logo.png" alt="DeenWallet Transfer" />
  <div class="badge" id="badge">&#10003;</div>
  <h1 id="title">Thank you</h1>
  <p id="msg">Please go back to the DeenWallet Transfer app. Your money is being sent to your mobile money account.</p>
  <small>You can close this page.</small>
</div>
<script>
(function () {
  var q = location.search || '';
  if (q.indexOf('cancel=1') !== -1) {
    document.getElementById('badge').className = 'badge cancel';
    document.getElementById('badge').innerHTML = '&times;';
    document.getElementById('title').textContent = 'Payment not completed';
    document.getElementById('msg').textContent = 'No money was taken. Please go back to the DeenWallet Transfer app to try again.';
  }
})();
</script>
</body>
</html>
