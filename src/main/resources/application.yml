spring:
  application:
    name: deen-wallet

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deenwallet_db}
    username: ${DB_USER:deenwallet}
    password: ${DB_PASSWORD:Abdul@10737}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST:smtp.queensmtp.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8082}
  tomcat:
    threads:
      max: 400
    accept-count: 200

app:
  release-id: ${APP_RELEASE_ID:${random.uuid}}

  mail:
    from-email: ${MAIL_FROM_EMAIL:no-reply@deenwallapp.com}
    from-name: ${MAIL_FROM_NAME:Deen Wallet}

  firebase:
    service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}

  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration-minutes: 5
    refresh-token-expiration-days: 7

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://127.0.0.1:8081,https://deenwallapp.com}

  support:
    whatsapp: ${SUPPORT_WHATSAPP:+23280613600}

  otp:
    length: 6
    expiry-minutes: 10
    max-attempts: 5
    resend-cooldown-seconds: 60

  monime:
    base-url: https://api.monime.io
    access-token: ${MONIME_ACCESS_TOKEN:}
    space-id: ${MONIME_SPACE_ID:}
    webhook-secret: ${MONIME_WEBHOOK_SECRET:}
    default-financial-account-id: ${MONIME_DEFAULT_FINANCIAL_ACCOUNT_ID:}

  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    phone: ${ADMIN_PHONE:}
    force-reset: ${ADMIN_FORCE_RESET:false}

  providers:
    prefixes:
      m17:
        - "76"
        - "78"
        - "79"
        - "75"
        - "71"
        - "72"
        - "73"
        - "74"
      m18:
        - "30"
        - "33"
        - "88"
        - "99"
        - "90"
        - "77"
        - "70"
        - "80"
      m19:
        - "31"
        - "32"
        - "34"
        - "35"
    default-provider: "m17"